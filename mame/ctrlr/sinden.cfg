<mameconfig version="10">
    <system name="default">
	<input>
	    <!-- Player 1 Lightgun -->
	    <port type="P1_LIGHTGUN_X">
		<newseq type="standard">JOYCODE_1_RXAXIS JOYCODE_1_XAXIS</newseq>
	    </port>

	    <port type="P1_LIGHTGUN_Y">
		<newseq type="standard">JOYCODE_1_RYAXIS JOYCODE_1_YAXIS</newseq>
	    </port>

	    <port type="P1_BUTTON1">
		<newseq type="standard">JOYCODE_1_BUTTON1</newseq>
	    </port>

	    <port type="P1_BUTTON2">
		<newseq type="standard">JOYCODE_1_BUTTON2</newseq>
	    </port>

	    <port type="P1_BUTTON3">
		<newseq type="standard">JOYCODE_1_BUTTON3</newseq>
	    </port>

	    <!-- Player 2 Lightgun -->
	    <port type="P2_LIGHTGUN_X">
		<newseq type="standard">JOYCODE_2_RXAXIS JOYCODE_2_XAXIS</newseq>
	    </port>

	    <port type="P2_LIGHTGUN_Y">
		<newseq type="standard">JOYCODE_2_RYAXIS JOYCODE_2_YAXIS</newseq>
	    </port>

	    <port type="P2_BUTTON1">
		<newseq type="standard">JOYCODE_2_BUTTON1</newseq>
	    </port>

	    <port type="P2_BUTTON2">
		<newseq type="standard">JOYCODE_2_BUTTON2</newseq>
	    </port>

	    <port type="P2_BUTTON3">
		<newseq type="standard">JOYCODE_2_BUTTON3</newseq>
	    </port>

	    <!-- Keyboard -->
	    <port type="START1">
		<newseq type="standard">KEYCODE_1</newseq>
	    </port>

	    <port type="COIN1">
		<newseq type="standard">KEYCODE_5</newseq>
	    </port>

	    <port type="START2">
		<newseq type="standard">KEYCODE_2</newseq>
	    </port>

	    <port type="COIN2">
		<newseq type="standard">KEYCODE_6</newseq>
	    </port>

	    <!-- Disable joystick from controlling UI -->
	    <port type="UI_UP">
		<newseq type="standard">KEYCODE_UP</newseq>
	    </port>

	    <port type="UI_DOWN">
		<newseq type="standard">KEYCODE_DOWN</newseq>
	    </port>

	    <port type="UI_LEFT">
		<newseq type="standard">KEYCODE_LEFT</newseq>
	    </port>

	    <port type="UI_RIGHT">
		<newseq type="standard">KEYCODE_RIGHT</newseq>
	    </port>

	    <port type="UI_SELECT">
		<newseq type="standard">KEYCODE_ENTER</newseq>
	    </port>

	    <port type="UI_CANCEL">
		<newseq type="standard">KEYCODE_ESC</newseq>
	    </port>

	    <port type="UI_CONFIGURE">
		<newseq type="standard">KEYCODE_TAB</newseq>
	    </port>
	</input>
    </system>
</mameconfig>